<!doctype html>
<html><head><meta charset="utf-8"><title>Dev Resolve</title>
<style>
  :root { --ok:#15803d; --okbg:#ecfdf3; --bad:#b91c1c; --badbg:#fef2f2; --warn:#b45309; --warnbg:#fffbeb; --line:#e3ebe6; --muted:#5b6b62; --fg:#14281d; --soft:#f3f8f5; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: #fff; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: linear-gradient(135deg, #0f5132, #15803d 60%, #22a35a); color: #fff; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: #fff; color: #15803d; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .title { font-weight: 600; font-size: 14px; } .ver { font-size: 11px; opacity: .75; }
  .pill { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.18); display: inline-flex; align-items: center; gap: 6px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: #fff; display: inline-block; }
  .pill.bad i { background: #fca5a5; } .pill.warn i { background: #fcd34d; }
  .verdict { margin: 12px 16px 4px; padding: 10px 12px; border-radius: 10px; font-size: 12px; }
  .verdict.ok { background: var(--okbg); color: var(--ok); } .verdict.bad { background: var(--badbg); color: var(--bad); } .verdict.warn { background: var(--warnbg); color: var(--warn); }
  .verdict b { display: block; font-size: 13px; margin-bottom: 2px; }
  ul { list-style: none; margin: 8px 0 0; padding: 0 16px; }
  li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: #d4a72c; }
  .k { flex: 1; } .v { color: var(--muted); font-size: 12px; text-align: right; }
  .sub { display: block; color: var(--muted); font-size: 11px; }
  .actions { display: flex; gap: 8px; padding: 12px 16px 16px; }
  a.btn, button.btn { flex: 1; text-align: center; text-decoration: none; font: inherit; font-size: 12px; font-weight: 600; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--fg); cursor: pointer; }
  a.btn.primary { background: #15803d; border-color: #15803d; color: #fff; }
  a.btn:hover, button.btn:hover { border-color: #15803d; }
  footer { padding: 0 16px 12px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  footer button { border: 0; background: none; color: #15803d; font: inherit; cursor: pointer; padding: 0; }
</style></head>
<body>
  <header>
    <div class="logo">DR</div>
    <div><div class="title">Dev Resolve</div><div class="ver" id="ver">connector</div></div>
    <span class="pill" id="pill"><i></i><span>…</span></span>
  </header>
  <div class="verdict" id="verdict">Checking…</div>
  <ul id="rows"></ul>
  <div class="actions">
    <a class="btn primary" id="open" target="_blank">Open Dev Resolve</a>
    <a class="btn" id="conn" target="_blank">Connector page</a>
  </div>
  <footer><span id="seen"></span><button id="recheck">Re-check</button></footer>
  <script src="popup.js"></script>
</body></html>
