# Local Postgres. "name" keeps the original project name, so the existing data volume (devresolve_dev-resolve-pg) is reused.
name: devresolve
services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-resolve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devresolve
      POSTGRES_PASSWORD: devresolve
      POSTGRES_DB: devresolve
    ports:
      - "${DEV_RESOLVE_DB_PORT:-5434}:5432"   # local Postgres port (DATABASE_URL must match)
    volumes:
      - dev-resolve-pg:/var/lib/postgresql/data
volumes:
  dev-resolve-pg:
