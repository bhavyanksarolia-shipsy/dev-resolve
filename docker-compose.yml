services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-resolve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devresolve
      POSTGRES_PASSWORD: devresolve
      POSTGRES_DB: devresolve
    ports:
      - "5434:5432"
    volumes:
      - dev-resolve-pg:/var/lib/postgresql/data
volumes:
  dev-resolve-pg:
