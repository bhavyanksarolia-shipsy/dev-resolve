# Render Blueprint — one web service (this Docker image) + one Postgres. Dashboard → New → Blueprint → this repo.
# Secrets are NOT in this file: every `sync: false` value is asked for in the dashboard; private config goes in
# Secret Files (see DEPLOY.md → Render).
services:
  - type: web
    name: dev-resolve
    runtime: docker
    plan: starter            # always on + a disk; the free plan sleeps and can't have a disk
    numInstances: 1          # one instance: the connector relay + Metabase rate limit live in memory
    healthCheckPath: /api/healthz
    disk:
      name: dev-resolve-data
      mountPath: /data       # config, knowledge, each person's sign-ins, synced code
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_RESOLVE_CONNECTOR
        value: "on"
      - key: DATABASE_URL
        fromDatabase: { name: dev-resolve-db, property: connectionString }
      - key: DATABASE_SSL
        value: "off"           # internal network URL; use "require" with the external URL
      - key: APP_URL           # https://<your-domain> (or https://dev-resolve.onrender.com)
        sync: false
      - key: DEVREV_TOKEN
        sync: false
      - key: DEVREV_BASE_URL
        sync: false
      - key: DEVREV_APP_URL
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN   # `claude setup-token` (or set ANTHROPIC_API_KEY instead)
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false
      - key: GOOGLE_ADMIN_EMAILS
        sync: false
      - key: CODE_GIT_BASE
        sync: false
      - key: GITHUB_TOKEN
        sync: false
databases:
  - name: dev-resolve-db
    plan: basic-256mb        # paid plans have daily backups + point-in-time recovery
    postgresMajorVersion: "16"
