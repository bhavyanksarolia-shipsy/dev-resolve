# Production: one Dev Resolve container + (optionally) Postgres. Put HTTPS in front (load balancer / Caddy / nginx).
#   docker compose -f docker-compose.prod.yml --env-file /secure/dev-resolve.env up -d
# With a managed Postgres (recommended), remove the "postgres" service and point DATABASE_URL at it.
services:
  app:
    image: dev-resolve:latest
    build: .
    restart: unless-stopped
    env_file: /secure/dev-resolve.env        # secrets — see .env.example (never in the repo)
    environment:
      NODE_ENV: production
      DEV_RESOLVE_CONNECTOR: "on"            # client-VPN + Google sign-ins come from each person's laptop
    ports:
      - "127.0.0.1:3000:3000"                # only the reverse proxy on this host talks to it
    volumes:
      - dev-resolve-data:/data               # config/, knowledge/, per-person sign-ins, synced code, logs
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
    volumes:
      - dev-resolve-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 10
volumes:
  dev-resolve-data:
  dev-resolve-pg:
